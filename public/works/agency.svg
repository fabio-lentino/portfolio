<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" fill="none">
  <title>Form — conceptual creative agency website</title>
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="1600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080808"/>
      <stop offset=".5" stop-color="#0B0C0A"/>
      <stop offset="1" stop-color="#11140B"/>
    </linearGradient>
    <radialGradient id="ag-glow" cx="0" cy="0" r="1" gradientTransform="translate(1300 170) rotate(115) scale(500 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6FF4D" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C6FF4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag-orb" cx="0" cy="0" r="1" gradientTransform="translate(1098 394) rotate(90) scale(170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAF6"/>
      <stop offset=".35" stop-color="#C6FF4D"/>
      <stop offset=".7" stop-color="#65752A"/>
      <stop offset="1" stop-color="#141A0A"/>
    </radialGradient>
    <linearGradient id="ag-orb-shade" x1="970" y1="270" x2="1200" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".55"/>
    </linearGradient>
    <filter id="ag-shadow" x="20" y="40" width="1560" height="1020" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="44" stdDeviation="52" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <filter id="ag-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="ag-clip">
      <rect x="140" y="170" width="1320" height="760" rx="24"/>
    </clipPath>
    <pattern id="ag-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="url(#ag-bg)"/>
  <rect width="1600" height="1100" fill="url(#ag-glow)"/>
  <rect width="1600" height="1100" fill="url(#ag-grid)"/>

  <text x="80" y="640" fill="none" stroke="#C6FF4D" stroke-opacity=".14" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="330" font-weight="700" letter-spacing="-14">FORM</text>

  <g transform="rotate(1.5 800 550)" filter="url(#ag-shadow)">
    <rect x="140" y="170" width="1320" height="760" rx="24" fill="#0C0D0B"/>
    <g clip-path="url(#ag-clip)">
      <rect x="140" y="170" width="1320" height="760" fill="#0C0D0B"/>
      <path d="M140 250h1320M140 720h1320M500 170v760M1260 170v760" stroke="#FFFFFF" stroke-opacity=".06"/>

      <text x="190" y="222" fill="#F2F2EC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="5">FORM®</text>
      <text x="610" y="220" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">Work</text>
      <text x="690" y="220" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">Studio</text>
      <text x="780" y="220" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">Thinking</text>
      <text x="880" y="220" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">Contact</text>
      <rect x="1300" y="196" width="108" height="36" rx="18" fill="#C6FF4D"/>
      <text x="1354" y="219" text-anchor="middle" fill="#0C0D0B" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1">START A PROJECT</text>

      <text x="190" y="316" fill="#C6FF4D" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3">INDEPENDENT CREATIVE STUDIO — SINCE 2019</text>

      <text x="186" y="460" fill="#F2F2EC" font-family="Georgia, 'Times New Roman', serif" font-size="94" letter-spacing="-4">Ideas with</text>
      <text x="186" y="554" fill="#C6FF4D" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-style="italic" letter-spacing="-4">a pulse.</text>

      <text x="190" y="614" fill="#9B9C92" font-family="Arial, Helvetica, sans-serif" font-size="14">We shape identities and digital products for brands</text>
      <text x="190" y="637" fill="#9B9C92" font-family="Arial, Helvetica, sans-serif" font-size="14">that refuse to blend in. Strategy, design, motion.</text>

      <g transform="translate(195 674)">
        <rect width="164" height="42" rx="21" fill="#F2F2EC"/>
        <text x="34" y="26" fill="#0C0D0B" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">VIEW SELECTED WORK</text>
        <path d="M132 21h12m-4-4 4 4-4 4" stroke="#0C0D0B" stroke-width="1.4"/>
      </g>

      <circle cx="1090" cy="414" r="194" fill="#C6FF4D" opacity=".13" filter="url(#ag-blur)"/>
      <circle cx="1090" cy="414" r="174" fill="url(#ag-orb)"/>
      <circle cx="1090" cy="414" r="174" fill="url(#ag-orb-shade)"/>
      <ellipse cx="1090" cy="414" rx="248" ry="56" transform="rotate(-18 1090 414)" stroke="#F2F2EC" stroke-opacity=".38"/>
      <ellipse cx="1090" cy="414" rx="286" ry="72" transform="rotate(32 1090 414)" stroke="#C6FF4D" stroke-opacity=".24"/>
      <circle cx="1318" cy="338" r="7" fill="#C6FF4D"/>
      <text x="1120" y="646" fill="#6D6F65" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.5">FORM / MOTION SYSTEM 01</text>

      <rect x="140" y="720" width="1320" height="70" fill="#C6FF4D"/>
      <text x="186" y="768" fill="#0C0D0B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="7">BRAND / DIGITAL / MOTION / CULTURE /</text>
      <text x="1346" y="766" fill="#0C0D0B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">BRAND /</text>

      <g transform="translate(190 830)">
        <text x="0" y="0" fill="#6D6F65" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">SELECTED CLIENTS*</text>
        <text x="0" y="34" fill="#DADAD2" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">NORTHWIND</text>
        <text x="160" y="34" fill="#DADAD2" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">KINETIC</text>
        <text x="290" y="34" fill="#DADAD2" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">OBJECTS</text>
        <text x="430" y="34" fill="#DADAD2" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">STUDIO NOIR</text>
        <text x="830" y="0" fill="#6D6F65" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">*FICTIONAL BRANDS — CONCEPT ONLY</text>
      </g>
    </g>
    <rect x="140.5" y="170.5" width="1319" height="759" rx="24" stroke="#FFFFFF" stroke-opacity=".15"/>
  </g>

  <g transform="translate(1292 590) rotate(3)">
    <rect width="228" height="438" rx="30" fill="#050505" stroke="#33352D" stroke-width="2"/>
    <rect x="10" y="10" width="208" height="418" rx="22" fill="#0F110C"/>
    <rect x="84" y="20" width="60" height="14" rx="7" fill="#050505"/>
    <text x="30" y="76" fill="#F2F2EC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">FORM®</text>
    <text x="166" y="76" fill="#C6FF4D" font-family="Arial, Helvetica, sans-serif" font-size="18">+</text>
    <text x="30" y="156" fill="#6D6F65" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2">CREATIVE STUDIO</text>
    <text x="30" y="212" fill="#F2F2EC" font-family="Georgia, serif" font-size="38" letter-spacing="-1">Ideas</text>
    <text x="30" y="248" fill="#F2F2EC" font-family="Georgia, serif" font-size="38" letter-spacing="-1">with</text>
    <text x="30" y="284" fill="#C6FF4D" font-family="Georgia, serif" font-style="italic" font-size="38" letter-spacing="-1">a pulse.</text>
    <rect x="30" y="326" width="168" height="1" fill="#FFFFFF" opacity=".1"/>
    <text x="30" y="360" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">Work</text>
    <text x="30" y="386" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">Studio</text>
    <text x="30" y="412" fill="#A0A097" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1">Contact</text>
  </g>

  <g transform="translate(80 84)">
    <circle cx="5" cy="5" r="5" fill="#C6FF4D"/>
    <text x="20" y="9" fill="#9A9C8F" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3">CONCEPT PROJECT / AGENCY WEBSITE</text>
  </g>
  <text x="1520" y="1040" fill="#57604A" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">FORM — A DIGITAL IDENTITY</text>
</svg>
