<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" fill="none">
  <title>Aura — conceptual e-commerce experience</title>
  <defs>
    <linearGradient id="eco-bg" x1="120" y1="80" x2="1480" y2="1060" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10130D"/>
      <stop offset="0.55" stop-color="#090B08"/>
      <stop offset="1" stop-color="#11160C"/>
    </linearGradient>
    <radialGradient id="eco-glow" cx="0" cy="0" r="1" gradientTransform="translate(1270 280) rotate(130) scale(480 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6FF4D" stop-opacity=".17"/>
      <stop offset="1" stop-color="#C6FF4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eco-glow2" cx="0" cy="0" r="1" gradientTransform="translate(290 810) rotate(-52) scale(360 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6D8FF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#B6D8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eco-panel" x1="904" y1="300" x2="1210" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#424A26"/>
      <stop offset=".5" stop-color="#232A18"/>
      <stop offset="1" stop-color="#11150C"/>
    </linearGradient>
    <linearGradient id="eco-vase1" x1="960" y1="350" x2="1090" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F0E5"/>
      <stop offset=".55" stop-color="#C8C5B5"/>
      <stop offset="1" stop-color="#8D917C"/>
    </linearGradient>
    <linearGradient id="eco-vase2" x1="1090" y1="430" x2="1190" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8FF7E"/>
      <stop offset="1" stop-color="#6A7B35"/>
    </linearGradient>
    <linearGradient id="eco-prod1" x1="346" y1="720" x2="470" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8E2D4"/>
      <stop offset="1" stop-color="#B8B29D"/>
    </linearGradient>
    <linearGradient id="eco-prod2" x1="646" y1="720" x2="760" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6FF4D"/>
      <stop offset="1" stop-color="#708B2F"/>
    </linearGradient>
    <filter id="eco-shadow" x="60" y="60" width="1480" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="40" stdDeviation="48" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="eco-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="eco-clip">
      <rect x="120" y="150" width="1360" height="800" rx="26"/>
    </clipPath>
    <pattern id="eco-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="url(#eco-bg)"/>
  <rect width="1600" height="1100" fill="url(#eco-glow)"/>
  <rect width="1600" height="1100" fill="url(#eco-glow2)"/>
  <rect width="1600" height="1100" fill="url(#eco-grid)"/>

  <g transform="rotate(-2 800 550)" filter="url(#eco-shadow)">
    <rect x="120" y="150" width="1360" height="800" rx="26" fill="#ECE8DD"/>
    <g clip-path="url(#eco-clip)">
