      <circle cx="154" cy="179" r="5.5" fill="#B7B3A7"/>
      <circle cx="174" cy="179" r="5.5" fill="#B7B3A7"/>
      <circle cx="194" cy="179" r="5.5" fill="#B7B3A7"/>
      <rect x="650" y="164" width="300" height="30" rx="15" fill="#F4F1E8"/>
      <text x="800" y="184" text-anchor="middle" fill="#9A978C" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1">aura-objects.com</text>

      <rect x="120" y="208" width="1360" height="742" fill="#ECE8DD"/>

      <text x="182" y="270" fill="#1B1C17" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="7">AURA</text>
      <text x="515" y="267" fill="#4A4B43" font-family="Arial, Helvetica, sans-serif" font-size="14">Collection</text>
      <text x="635" y="267" fill="#4A4B43" font-family="Arial, Helvetica, sans-serif" font-size="14">Objects</text>
      <text x="755" y="267" fill="#4A4B43" font-family="Arial, Helvetica, sans-serif" font-size="14">Journal</text>
      <text x="855" y="267" fill="#4A4B43" font-family="Arial, Helvetica, sans-serif" font-size="14">About</text>
      <circle cx="1266" cy="260" r="19" fill="#1B1C17"/>
      <path d="M1260 254h7v7h-7v-7Zm8 1h7v8h-7v-8Z" fill="#ECE8DD"/>
      <text x="1300" y="265" fill="#4A4B43" font-family="Arial, Helvetica, sans-serif" font-size="14">Bag (2)</text>

      <text x="182" y="360" fill="#777968" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3">NEW COLLECTION / 2026</text>
      <text x="178" y="447" fill="#1B1C17" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-2">Objects with a</text>
      <text x="178" y="518" fill="#1B1C17" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-2">quiet presence.</text>
      <text x="182" y="565" fill="#6E705F" font-family="Arial, Helvetica, sans-serif" font-size="15">Sculptural pieces for everyday rituals.</text>
      <text x="182" y="587" fill="#6E705F" font-family="Arial, Helvetica, sans-serif" font-size="15">Made slowly, designed to last.</text>

      <rect x="182" y="620" width="184" height="48" rx="24" fill="#1B1C17"/>
      <text x="224" y="650" fill="#F1EEE4" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">EXPLORE THE EDIT</text>
      <path d="M336 644h12m-4-4 4 4-4 4" stroke="#C6FF4D" stroke-width="1.5"/>

      <rect x="182" y="722" width="292" height="166" rx="14" fill="#E2DED2"/>
      <rect x="198" y="738" width="260" height="102" rx="8" fill="#D7D3C5"/>
      <ellipse cx="328" cy="800" rx="38" ry="9" fill="#B9B4A3" opacity=".45"/>
      <path d="M306 792c-4-30-3-48 22-56 25 8 26 26 22 56-8 8-36 8-44 0Z" fill="url(#eco-prod1)"/>
      <path d="M312 760c2-16 5-24 16-26 11 2 14 10 16 26-8 5-24 5-32 0Z" fill="#F0EDE3" opacity=".7"/>
      <text x="198" y="866" fill="#33352B" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">SORA VASE</text>
      <text x="442" y="866" fill="#6E705F" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12">$120</text>

      <rect x="494" y="722" width="292" height="166" rx="14" fill="#E2DED2"/>
      <rect x="510" y="738" width="260" height="102" rx="8" fill="#D7D3C5"/>
      <rect x="628" y="758" width="26" height="62" rx="13" fill="url(#eco-prod2)"/>
      <rect x="636" y="748" width="10" height="16" rx="5" fill="#C6FF4D"/>
      <ellipse cx="641" cy="822" rx="28" ry="7" fill="#9A9D79" opacity=".35"/>
      <text x="510" y="866" fill="#33352B" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">MOSS CANDLE</text>
      <text x="754" y="866" fill="#6E705F" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12">$48</text>

      <rect x="806" y="722" width="292" height="166" rx="14" fill="#E2DED2"/>
      <rect x="822" y="738" width="260" height="102" rx="8" fill="#D7D3C5"/>
      <circle cx="952" cy="790" r="30" fill="#C9C6B8"/>
      <circle cx="952" cy="790" r="20" fill="#B8B5A5"/>
      <circle cx="952" cy="790" r="8" fill="#E9E5D9"/>
      <text x="822" y="866" fill="#33352B" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">STILL BOWL</text>
      <text x="1066" y="866" fill="#6E705F" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12">$86</text>

      <rect x="908" y="292" width="444" height="394" rx="18" fill="url(#eco-panel)"/>
      <circle cx="1180" cy="368" r="120" fill="#C6FF4D" opacity=".12" filter="url(#eco-blur)"/>
      <path d="M1000 640c-24-120-10-194 74-224 78 28 96 102 72 224-40 32-106 32-146 0Z" fill="url(#eco-vase1)"/>
      <path d="M1040 458c4-48 10-74 34-82 24 8 30 34 34 82-20 14-48 14-68 0Z" fill="#F7F4EA" opacity=".55"/>
      <path d="M1132 646c-16-76-6-124 38-146 42 22 54 74 36 146-24 18-52 18-74 0Z" fill="url(#eco-vase2)"/>
      <ellipse cx="1090" cy="654" rx="136" ry="18" fill="#070906" opacity=".45"/>
      <text x="944" y="322" fill="#C6FF4D" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3">AURA EDITION — 01</text>
      <text x="944" y="674" fill="#E9E7DB" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5">FORM / FUNCTION / FEELING</text>

      <rect x="182" y="900" width="1160" height="1" fill="#C8C4B8"/>
      <text x="182" y="924" fill="#8A8C7C" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">CARBON NEUTRAL SHIPPING</text>
      <text x="1200" y="924" fill="#8A8C7C" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">DESIGNED IN SMALL BATCHES</text>
    </g>
    <rect x="120.5" y="150.5" width="1359" height="799" rx="26" stroke="#FFFFFF" stroke-opacity=".18"/>
  </g>

  <g transform="translate(1160 104) rotate(4)">
    <rect width="290" height="86" rx="14" fill="#0D0F0B" stroke="#2A3020"/>
    <circle cx="30" cy="30" r="5" fill="#C6FF4D"/>
    <text x="48" y="34" fill="#F1F1EA" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">CONCEPT PROJECT</text>
    <text x="30" y="60" fill="#8A8F7C" font-family="Arial, Helvetica, sans-serif" font-size="11">E-commerce / Art direction / 2026</text>
  </g>

  <text x="120" y="1040" fill="#57604A" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">AURA — DIGITAL FLAGSHIP</text>
  <text x="1480" y="1040" fill="#57604A" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">CONCEPT / NOT A REAL CLIENT</text>
</svg>
